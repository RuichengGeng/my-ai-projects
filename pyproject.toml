[project]
name = "open-source-finance-ai"
version = "0.1.0"
description = "Unified finance AI service combining multiple open-source projects"
requires-python = ">=3.12"
dependencies = [
    # --- Kronos dependencies ---
    "numpy",
    "pandas>=2.3.0",
    "torch>=2.0.0",
    "einops==0.8.1",
    "huggingface_hub==0.33.1",
    "matplotlib==3.9.3",
    "tqdm>=4.67.1",
    "safetensors==0.6.2",
    # --- TradingAgents dependencies (from pyproject.toml) ---
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "parsel>=1.10.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    # --- pdf_parser dependencies ---
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    # --- RAG dependencies ---
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0.0",
    "anthropic>=0.40.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["finance_ai*", "my_playground*", "rag*", "pdf_parser*", "utils*"]
exclude = ["kronos*", "tradingagents*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
